services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/cfg.yaml"]
    volumes: ["./collector.yaml:/cfg.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [jaeger]
