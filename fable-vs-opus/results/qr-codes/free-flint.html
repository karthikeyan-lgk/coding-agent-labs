<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How a QR Code Holds &amp; Repairs Your Message</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #04060e; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #e8eefc; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }

  #scanline { position: absolute; left: 0; right: 0; top: -20%; height: 120px; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(34,211,238,0.07), transparent); animation: scan 3.2s linear infinite; }

  #btn-mute { pointer-events: auto; background: rgba(148,163,184,0.08); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); border-radius: 10px; width: 40px; height: 40px; font-size: 16px; cursor: pointer; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; pointer-events: none; }
  .card { pointer-events: auto; width: min(680px, 100%); background: rgba(8,12,28,0.62); border: 1px solid rgba(125,211,252,0.16); border-radius: 22px; padding: 34px 38px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 30px 80px rgba(0,0,0,0.55); animation: cardIn .7s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
  .kicker { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #22d3ee; margin-bottom: 14px; }
  h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.04; font-weight: 800; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #22d3ee; text-shadow: 0 0 30px rgba(34,211,238,.5); }
  h2 { font-size: clamp(22px, 3.4vw, 30px); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 18px; }
  .lede { color: #9db0cc; font-size: 16px; line-height: 1.6; margin: 16px 0 8px; }
  .msg-wrap { display: flex; align-items: center; justify-content: center; padding: 18px 0 6px; }
  #msg-big { font-size: clamp(64px, 12vw, 110px); font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #67e8f9, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 60px rgba(103,232,249,0.25); }
  #bits-view { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 4px; align-items: center; }
  .bitrow { display: flex; gap: 6px; align-items: center; }
  .bitrow .bitlab { font-family: ui-monospace, monospace; font-size: 11px; color: #64748b; width: 18px; }
  .bit { width: 16px; height: 16px; border-radius: 4px; background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.2); }
  .bit.on { background: #22d3ee; box-shadow: 0 0 10px rgba(34,211,238,0.8); border-color: #22d3ee; }
  .facts { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
  .fact { flex: 1; min-width: 110px; background: rgba(15,23,42,0.6); border: 1px solid rgba(148,163,184,0.14); border-radius: 14px; padding: 14px; }
  .fact b { display: block; font-size: 26px; color: #a5f3fc; font-family: ui-monospace, monospace; }
  .fact span { font-size: 11px; color: #7d8aa5; text-transform: uppercase; letter-spacing: 1px; }
  .code-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: center; }
  @media (max-width: 640px) { .code-grid { grid-template-columns: 1fr; } }
  .qr-panel { border: 1px solid rgba(148,163,184,0.14); border-radius: 16px; padding: 14px; background: rgba(2,6,18,0.5); display: flex; align-items: center; justify-content: center; min-height: 180px; }
  .cw-panel { background: rgba(15,23,42,0.6); border: 1px solid rgba(148,163,184,0.14); border-radius: 16px; padding: 16px; }
  .cw-title { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 2px; color: #64748b; margin: 10px 0 6px; }
  .cw-title:first-child { margin-top: 0; }
  .cw-hex { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; color: #a5f3fc; word-break: break-all; letter-spacing: 1px; }
  .t-note { margin-top: 12px; font-size: 12px; color: #94a3b8; }
  .t-note b { color: #fbbf24; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .btn { pointer-events: auto; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; letter-spacing: 0.3px; padding: 14px 22px; border-radius: 14px; color: #04121a; background: linear-gradient(135deg, #22d3ee, #818cf8); box-shadow: 0 10px 30px rgba(34,211,238,0.28); transition: transform .15s, box-shadow .2s, filter .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(34,211,238,0.4); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: rgba(148,163,184,0.1); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.25); box-shadow: none; }
  .btn.warn { background: linear-gradient(135deg, #fbbf24, #f97316); color: #1a1204; box-shadow: 0 10px 30px rgba(251,191,36,0.25); }
  .btn.danger { background: linear-gradient(135deg, #f87171, #e11d48); color: #2a060c; box-shadow: 0 10px 30px rgba(239,68,68,0.3); }
  .cta-row { margin-top: 26px; display: flex; justify-content: flex-end; }
  .status { margin-top: 18px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #94a3b8; min-height: 20px; }
  .status.ok { color: #34d399; }
  .status.bad { color: #f87171; }
  .formula { font-family: ui-monospace, Menlo, monospace; font-size: clamp(28px, 5vw, 44px); text-align: center; padding: 22px; color: #fbbf24; letter-spacing: 1px; background: rgba(15,23,42,0.7); border: 1px solid rgba(251,191,36,0.25); border-radius: 16px; margin: 8px 0 18px; }
  .how { list-style: none; display: flex; flex-direction: column; gap: 10px; color: #b6c2d8; font-size: 14.5px; line-height: 1.5; }
  .how b { color: #22d3ee; font-family: ui-monospace, monospace; }
  .foot { text-align: center; padding: 14px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(148,163,184,0.45); font-family: ui-monospace, monospace; }
  .fade { animation: cardIn .7s cubic-bezier(.2,.9,.25,1) both; }
  @media (max-width: 720px) { .card { padding: 24px 20px; border-radius: 16px; } #topbar { padding: 14px 16px; } }
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div id="scanline"></div>
  <div id="ui">
    <div id="topbar">
      <div class="brand">&#9670; QR / Field Guide</div>
      <div id="stepdots"></div>
      <button id="btn-mute" title="Toggle sound">&#128266;</button>
    </div>
    <div id="stage"></div>
    <div class="foot">Three.js &middot; Web Audio &middot; Reed-Solomon &middot; GF(256)</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";
var $ = function (id) { return document.getElementById(id); };

var MESSAGE = "HELLO";
var SIZE = 21;
var EC_LEVEL = "M";
var DATA_CODES = [0x40,0x54,0x84,0x54,0xC4,0xC4,0xF0,0xEC,0x11,0xEC,0x11,0xEC,0x11,0xEC,0x11,0xEC];
var EC_CODES  = [0x23,0x73,0x23,0x99,0xEC,0x08,0xC9,0xF7,0x37,0xDF];
var T = 5;
var TOTAL_CODES = 26;
var EC_BITS = 80;
var DATA_BITS = 128;

var MATRIX = [
  "111111100011101111111",
  "100000100001001000001",
  "101110101010101011101",
  "101110101001101011101",
  "101110101111101011101",
  "100000101100101000001",
  "111111101010101111111",
  "000000001001100000000",
  "101111100000101111100",
  "000010011100100101111",
  "110011110001010011001",
  "001100000100000110000",
  "000011110011010010100",
  "000000001011111001011",
  "111111100000101100101",
  "100000101111111001001",
  "101110101010100100100",
  "101110101000100100100",
  "101110101001010010100",
  "100000100010000110101",
  "111111101011010010100"
];

var AC = null, master = null, noiseBuf = null, droneO1 = null, droneO2 = null, droneLP = null, droneG = null, droneLFO = null, droneLFOG = null;
var muted = false;

function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
    var len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    droneO1 = AC.createOscillator(); droneO1.type = "sawtooth"; droneO1.frequency.value = 55;
    droneO2 = AC.createOscillator(); droneO2.type = "sine"; droneO2.frequency.value = 82.41;
    droneLP = AC.createBiquadFilter(); droneLP.type = "lowpass"; droneLP.frequency.value = 340;
    droneG = AC.createGain(); droneG.gain.value = 0.05;
    droneO1.connect(droneLP); droneO2.connect(droneLP); droneLP.connect(droneG); droneG.connect(master);
    droneO1.start(); droneO2.start();
    droneLFO = AC.createOscillator(); droneLFO.frequency.value = 0.07;
    droneLFOG = AC.createGain(); droneLFOG.gain.value = 0.025;
    droneLFO.connect(droneLFOG); droneLFOG.connect(droneG); droneLFO.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, gain, slideTo, delay) {
  if (!AC || muted) return;
  var t = AC.currentTime + (delay || 0);
  var o = AC.createOscillator(); var g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
  g.gain.setValueAtTime(gain || 0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, gain) {
  if (!AC || muted || !noiseBuf) return;
  var t = AC.currentTime;
  var src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.8;
  var g = AC.createGain(); g.gain.setValueAtTime(gain || 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.05);
}
function chime() { tone(523.25, 0.16, "triangle", 0.12); tone(659.25, 0.16, "triangle", 0.12, null, 0.09); tone(783.99, 0.22, "triangle", 0.12, null, 0.18); tone(1046.5, 0.3, "sine", 0.1, null, 0.27); }
function thud() { tone(140, 0.7, "sawtooth", 0.22, 42); noiseBurst(0.5, 0.3); }
function blip(f, d, t, g) { tone(f, d, t || "triangle", g === undefined ? 0.08 : g); }

var renderer, scene, camera, clock, inst;
var stateMap = {};
var COLOR = { fn: 0x161d33, idle: 0x10162a, data: 0x22d3ee, ec: 0xfb923c, damaged: 0xef4444, fixed: 0x34d399 };

function buildScene() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById("scene").appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04060e);
  scene.fog = new THREE.Fog(0x04060e, 40, 90);
  camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 12.5, 19);
  var hemi = new THREE.HemisphereLight(0x8fb8ff, 0x05070f, 0.5);
  scene.add(hemi);
  var pl = new THREE.PointLight(0x22d3ee, 0.6, 60);
  pl.position.set(6, 10, 8);
  scene.add(pl);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: 0x0a0f22, transparent: true, opacity: 0.9 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01;
  scene.add(ground);
  var grid = new THREE.GridHelper(60, 30, 0x1e2a4a, 0x101830);
  grid.position.y = 0.001;
  var gm = grid.material; gm.opacity = 0.5; gm.transparent = true;
  scene.add(grid);
  var starGeo = new THREE.BufferGeometry();
  var starPos = new Float32Array(600 * 3);
  for (var i = 0; i < 600; i++) {
    starPos[i*3] = (Math.random()-0.5) * 120;
    starPos[i*3+1] = (Math.random()-0.5) * 80 + 10;
    starPos[i*3+2] = (Math.random()-0.5) * 120;
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: 0x9db4ff, size: 0.12, transparent: true, opacity: 0.7 });
  scene.add(new THREE.Points(starGeo, starMat));
  var qrGroup = new THREE.Group();
  scene.add(qrGroup);
  var count = SIZE * SIZE;
  var geo = new THREE.BoxGeometry(0.94, 0.8, 0.94);
  var mat = new THREE.MeshBasicMaterial({ color: 0x10162a });
  inst = new THREE.InstancedMesh(geo, mat, count);
  var m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    var idx = r * SIZE + c;
    p.set(c - (SIZE - 1) / 2, 0.4, 0);
    q.set(0, 0, 0, 1); s.set(0.94, 0.8, 0.94);
    m.compose(p, q, s);
    inst.setMatrixAt(idx, m);
    inst.setColorAt(idx, new THREE.Color(COLOR.fn));
  }
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) { inst.instanceColor.needsUpdate = true; }
  scene.add(inst);
  for (var rr = 0; rr < SIZE; rr++) for (var cc = 0; cc < SIZE; cc++) stateMap[rr + "," + cc] = "fn";
}

function setModule(r, c, st) {
  stateMap[r + "," + c] = st;
  var idx = r * SIZE + c;
  inst.setColorAt(idx, new THREE.Color(COLOR[st] !== undefined ? COLOR[st] : COLOR.idle));
  inst.instanceColor.needsUpdate = true;
}
function setModuleMatrix(r, c) {
  var idx = r * SIZE + c;
  var m = new THREE.Matrix4();
  var p = new THREE.Vector3(c - (SIZE - 1) / 2, 0.4, 0);
  var q = new THREE.Quaternion(); var s = new THREE.Vector3(0.94, 0.8, 0.94);
  m.compose(p, q, s);
  inst.setMatrixAt(idx, m);
}
function shakeModule(r, c) {
  var idx = r * SIZE + c;
  var m = new THREE.Matrix4();
  var p = new THREE.Vector3(c - (SIZE - 1) / 2, 0.4, (Math.random() - 0.5) * 0.5);
  var q = new THREE.Quaternion(); var s = new THREE.Vector3(0.94, 0.8, 0.94);
  m.compose(p, q, s);
  inst.setMatrixAt(idx, m);
  inst.instanceMatrix.needsUpdate = true;
}
function isFunction(r, c) {
  var inTL = r <= 7 && c <= 7;
  var inTR = r <= 7 && c >= 13;
  var inBL = r >= 14 && c <= 7;
  var inBR = r >= 14 && c >= 13;
  if (inTL || inTR || inBL || inBR) return true;
  if (r === 6 && c >= 8 && c <= 12) return true;
  if (c === 6 && r >= 8 && r <= 12) return true;
  if (r >= 8 && r <= 11 && c >= 8 && c <= 11) return true;
  return false;
}
function buildDataOrder() {
  var order = [];
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    if (!isFunction(r, c)) order.push({ r: r, c: c });
  }
  return order;
}
var dataOrder = buildDataOrder();
var dataModules = dataOrder.slice(0, DATA_BITS / 8);
var ecModules = dataOrder.slice(DATA_BITS / 8, DATA_BITS / 8 + EC_BITS / 8);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

var currentStep = 0;
var stageEl = $("stage");
var repairStatusEl = null;

function updateDots(n) {
  var dots = document.querySelectorAll(".dot");
  for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i === n);
}

function goTo(n) {
  currentStep = n;
  renderStep(n);
  updateDots(n);
  setSceneForStep(n);
  wireStep(n);
}

function setSceneForStep(n) {
  for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
    if (isFunction(r, c)) setModule(r, c, "fn");
    else setModule(r, c, "idle");
  }
  if (n === 0 || n === 2 || n === 4) {
    for (var rr = 0; rr < SIZE; rr++) for (var cc = 0; cc < SIZE; cc++) {
      if (!isFunction(rr, cc)) setModule(rr, cc, "data");
    }
  }
  var sl = document.getElementById("scanline");
  if (sl) sl.style.display = (n === 3) ? "block" : "none";
}

function renderStep(n) {
  var html = "";
  if (n === 0) {
    html = `<div class="card fade"><div class="kicker">Interactive Field Guide</div><h1>How a QR Code <em>Holds</em> &amp; <em>Repairs</em> Your Message</h1><p class="lede">Your message becomes a grid of dark and light squares. Then Reed-Solomon wraps that grid in error-correcting redundancy, so smashed modules rarely kill the message.</p><div class="cta-row"><button class="btn" id="cta-intro">Start the scan</button></div></div>`;
  } else if (n === 1) {
    var bits = "";
    var chars = MESSAGE.split("");
    for (var i = 0; i < chars.length; i++) {
      var b = chars[i].charCodeAt(0).toString(2).padStart(8, "0");
      var row = "";
      for (var j = 0; j < 8; j++) row += `<div class="bit ${b[j] === "1" ? "on" : ""}"></div>`;
      bits += `<div class="bitrow">${row}</div>`;
    }
    html = `<div class="card fade"><div class="kicker">Step 01 / The Message</div><h2>Start with a string</h2><div class="msg-wrap"><span id="msg-big">${MESSAGE}</span></div><div id="bits-view">${bits}</div><div class="facts"><div class="fact"><b>40</b><span>bits of message</span></div><div class="fact"><b>16</b><span>data codewords</span></div><div class="fact"><b>10</b><span>parity codewords</span></div><div class="fact"><b>5</b><span>errors it can fix</span></div></div><div class="cta-row"><button class="btn" id="cta-msg">Encode it &rarr;</button></div></div>`;
  } else if (n === 2) {
    var hexData = "";
    for (var i = 0; i < DATA_CODES.length; i++) { hexData += (i ? "  " : "") + "0x" + DATA_CODES[i].toString(16).toUpperCase(); }
    var hexEc = "";
    for (var j = 0; j < EC_CODES.length; j++) { hexEc += (j ? "  " : "") + "0x" + EC_CODES[j].toString(16).toUpperCase(); }
    html = `<div class="card fade"><div class="kicker">Step 02 / The Code</div><h2>The square that carries bytes</h2><div class="code-grid"><div class="qr-panel"><div style="color:#64748b;font-size:12px;font-family:ui-monospace,monospace;letter-spacing:2px;">THE 21x21 GRID</div></div><div class="cw-panel"><div class="cw-title">DATA CODES</div><div class="cw-hex" id="cw-data-hex">${hexData}</div><div class="cw-title">ERROR CORRECTION &mdash; PARITY</div><div class="cw-hex" id="cw-ec-hex">${hexEc}</div><div class="t-note">Reed-Solomon over GF(256) &middot; corrects up to <b>t = 5</b> errors &middot; (n-k)/2</div></div></div><div class="cta-row"><button class="btn" id="cta-break">Try to break it &rarr;</button></div></div>`;
  } else if (n === 3) {
    html = `<div class="card fade"><div class="kicker">Step 03 / Repair</div><h2>Corrupt. Detect. Correct.</h2><p class="lede" style="margin-bottom:0">Damage the code yourself &mdash; or let the demo do it. Reed-Solomon will find the difference and reverse it.</p><div class="btn-row"><button class="btn warn" id="btn-dmg-1">Corrupt lightly &middot; 2 errors</button><button class="btn danger" id="btn-dmg-8">Corrupt heavily &middot; 8 errors</button><button class="btn ghost" id="btn-clear">Clear damage</button></div><div class="status" id="repair-status">Status: healthy</div><div class="cta-row"><button class="btn" id="cta-repair-next">See the fix &rarr;</button></div></div>`;
  } else {
    html = `<div class="card fade"><div class="kicker">Step 04 / The Fix</div><h2>Why redundancy works</h2><div class="formula">t = (n &minus; k) / 2</div><ul class="how"><li><b>1.</b> Message becomes bits, then codewords.</li><li><b>2.</b> Reed-Solomon appends parity codewords (the EC layer).</li><li><b>3.</b> Syndromes &amp; error locator polynomials find what broke.</li><li><b>4.</b> Chien search &amp; Forney algorithm correct it.</li><li><b>5.</b> Up to <b>t</b> errors fixed &mdash; beyond that, the code gives up.</li></ul><div class="cta-row"><button class="btn" id="cta-restart">Restart the scan</button></div></div>`;
  }
  stageEl.innerHTML = html;
  repairStatusEl = $("repair-status");
}

function wireStep(n) {
  if (n === 0) {
    $("cta-intro").onclick = function () { initAudio(); goTo(1); };
  } else if (n === 1) {
    $("cta-msg").onclick = function () { initAudio(); goTo(2); runEncode(); };
  } else if (n === 2) {
    $("cta-break").onclick = function () { initAudio(); goTo(3); };
  } else if (n === 3) {
    $("btn-dmg-1").onclick = function () { initAudio(); setSceneForStep(3); runEncode(); setTimeout(function () { damageRandom(2); setTimeout(function () { runRepair(); }, 700); }, 4600); };
    $("btn-dmg-8").onclick = function () { initAudio(); setSceneForStep(3); runEncode(); setTimeout(function () { damageRandom(8); setTimeout(function () { runRepair(); }, 700); }, 4600); };
    $("btn-clear").onclick = function () { clearDamage(); if (repairStatusEl) { repairStatusEl.className = "status"; repairStatusEl.textContent = "Status: healthy"; } };
    $("cta-repair-next").onclick = function () { initAudio(); goTo(4); };
  } else if (n === 4) {
    $("cta-restart").onclick = function () { initAudio(); goTo(0); };
  }
}

var damageMap = {};

function runEncode() {
  var delay = 150;
  dataModules.forEach(function (m) {
    setTimeout(function () { setModule(m.r, m.c, "data"); blip(540, 0.07, "triangle", 0.09); }, delay);
    delay += 5 + Math.random() * 9;
  });
  setTimeout(function () {
    ecModules.forEach(function (m) {
      setTimeout(function () { setModule(m.r, m.c, "ec"); blip(300, 0.09, "sine", 0.08); }, delay);
      delay += 5;
    });
    setTimeout(function () { chime(); }, delay + 250);
  }, delay);
}

function damageRandom(n) {
  var healthy = [];
  dataOrder.forEach(function (m) { if (!damageMap[m.r + "," + m.c]) healthy.push(m); });
  for (var i = 0; i < n && healthy.length; i++) {
    var m = healthy.splice(Math.floor(Math.random() * healthy.length), 1)[0];
    var key = m.r + "," + m.c;
    damageMap[key] = true;
    setModule(m.r, m.c, "damaged");
    shakeModule(m.r, m.c);
    noiseBurst(0.28, 0.32);
  }
}

function clearDamage() {
  var keys = Object.keys(damageMap);
  keys.forEach(function (k) { var p = k.split(",").map(Number); setModule(p[0], p[1], "idle"); });
  damageMap = {};
}

function runRepair() {
  var n = Object.keys(damageMap).length;
  if (n === 0) { if (repairStatusEl) { repairStatusEl.className = "status"; repairStatusEl.textContent = "Status: nothing damaged — use the buttons above."; } return; }
  if (n > T) {
    if (repairStatusEl) { repairStatusEl.className = "status bad"; repairStatusEl.textContent = "Status: TOO MANY ERRORS (" + n + " > t = " + T + ") — the code gives up."; }
    thud();
    return;
  }
  if (repairStatusEl) { repairStatusEl.className = "status"; repairStatusEl.textContent = "Status: decoding…"; }
  setTimeout(function () { if (repairStatusEl) { repairStatusEl.textContent = "Status: syndromes — " + n + " error(s) found"; } }, 520);
  setTimeout(function () { if (repairStatusEl) { repairStatusEl.textContent = "Status: locating errors…"; } }, 1050);
  setTimeout(function () { if (repairStatusEl) { repairStatusEl.textContent = "Status: correcting…"; } }, 1450);
  setTimeout(function () {
    var keys = Object.keys(damageMap);
    keys.forEach(function (k) { var p = k.split(",").map(Number); setModule(p[0], p[1], "fixed"); });
    damageMap = {};
    if (repairStatusEl) { repairStatusEl.className = "status ok"; repairStatusEl.textContent = "Status: ✓ corrected " + n + " error(s) — message recovered."; }
    chime();
  }, 2000);
}

function init() {
  buildScene();
  clock = new THREE.Clock();
  animate();
  var d = document.getElementById("stepdots");
  d.innerHTML = '<div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  goTo(0);
  $("btn-mute").onclick = function () { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; };
  window.addEventListener("resize", function () { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });
  var canvas = renderer.domElement;
  canvas.addEventListener("click", function (e) {
    if (currentStep !== 3) return;
    var rect = canvas.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    var y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    var ray = camera.rayFromNdc(new THREE.Vector2(x, y), new THREE.Vector2(0, 0));
    var plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    var pt = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, pt)) return;
    var c = Math.round(pt.x + (SIZE - 1) / 2);
    var r = Math.round(pt.y + (SIZE - 1) / 2);
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
    if (isFunction(r, c)) return;
    var key = r + "," + c;
    if (damageMap[key]) { var p = key.split(",").map(Number); setModule(p[0], p[1], "idle"); delete damageMap[key]; }
    else { damageMap[key] = true; setModule(r, c, "damaged"); shakeModule(r, c); noiseBurst(0.25, 0.3); }
  });
}

init();
})();
</script>
</body>
