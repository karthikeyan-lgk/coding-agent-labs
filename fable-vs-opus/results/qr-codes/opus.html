<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squares That Remember — how a QR code holds and repairs a message</title>
<style>
  :root{
    --bg:#080a11; --ink:#e9ecf5; --dim:#9aa3b8; --faint:#5d6680;
    --glass:rgba(13,16,27,.74); --line:rgba(255,255,255,.08);
    --finder:#ff6b5a; --timing:#2ec4b6; --align:#a07cff; --format:#ffb703; --dark:#ffd166;
    --data:#3a86ff; --ec:#ff4f9a; --blockA:#33c3ff; --blockB:#ffc233; --dmg:#ff2d55; --fix:#3dffa8;
    --mode:#ffd166; --len:#c77dff; --term:#8d99ae; --pad:#2ec4b6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;color:inherit;cursor:pointer}

  /* top bar */
  #top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:14px 20px;pointer-events:none;z-index:5}
  #brand{pointer-events:auto;display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.02em}
  #brand .logo{width:22px;height:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  #brand .logo i{background:#e9e4d6;border-radius:2px}
  #brand .logo i:nth-child(2n){background:transparent;outline:1px solid #e9e4d633}
  #brand small{display:block;font-weight:400;color:var(--dim);font-size:12px;letter-spacing:0}
  #controls{margin-left:auto;display:flex;gap:10px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  .field{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px;backdrop-filter:blur(12px)}
  .field label{font-size:12px;color:var(--dim)}
  #msg{background:transparent;border:0;outline:0;color:var(--ink);width:230px;font:14px ui-monospace,Menlo,Consolas,monospace}
  #cap{font-size:11px;color:var(--faint);min-width:44px;text-align:right}
  #cap.over{color:var(--dmg)}
  .seg{display:flex;background:rgba(255,255,255,.05);border-radius:9px;padding:2px}
  .seg button{background:transparent;border:0;padding:4px 9px;border-radius:7px;font-size:13px;color:var(--dim)}
  .seg button.on{background:#e9e4d6;color:#111}
  .iconbtn{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;backdrop-filter:blur(12px)}
  .iconbtn:hover{border-color:rgba(255,255,255,.25)}
  .iconbtn.on{border-color:#e9e4d6aa}

  /* card */
  #card{position:fixed;left:22px;top:82px;width:410px;max-height:calc(100vh - 170px);overflow:auto;z-index:4;
    background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:22px 24px 20px;backdrop-filter:blur(16px);
    box-shadow:0 20px 60px rgba(0,0,0,.45);scrollbar-width:thin;transition:opacity .35s, transform .35s}
  #card.swap{opacity:0;transform:translateY(8px)}
  #card .kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  #card h1{margin:.25em 0 .45em;font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
  #card p{margin:.55em 0;color:#cfd5e4}
  #card b{color:#fff}
  #card .note{font-size:13px;color:var(--dim)}
  .k{display:inline-block;padding:0 6px;border-radius:5px;font-size:12.5px;line-height:19px;color:#0b0d14;font-weight:600}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--dim)}
  .stat b{display:block;font-size:16px;color:#fff}
  .widget{margin-top:14px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-bottom:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* bit chips */
  #chips{display:flex;flex-wrap:wrap;gap:4px}
  .cw{display:flex;gap:1px;padding:2px;border-radius:4px;background:rgba(255,255,255,.04);opacity:.22;transition:opacity .2s, transform .2s}
  .cw.lit{opacity:1}
  .cw.now{transform:scale(1.25);box-shadow:0 0 0 1px #fff8}
  .cw s{display:block;width:5px;height:11px;border-radius:1px;text-decoration:none}
  .cw s.z{opacity:.28}
  #ring{font-size:13px;min-height:22px;margin-bottom:8px;color:#fff}
  /* parts list */
  .parts{list-style:none;margin:10px 0 0;padding:0}
  .parts li{display:flex;gap:10px;padding:7px 8px;border-radius:10px;opacity:.45;transition:all .3s;font-size:13.5px}
  .parts li.on{opacity:1;background:rgba(255,255,255,.05)}
  .parts li.done{opacity:.85}
  .parts li i{flex:none;width:12px;height:12px;border-radius:3px;margin-top:4px}
  .parts li b{display:block}
  .parts li span{color:var(--dim)}
  /* mask bars */
  .mrow{display:grid;grid-template-columns:26px 54px 1fr 40px;align-items:center;gap:8px;padding:3px 4px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .mrow:hover{background:rgba(255,255,255,.05)}
  .mrow.on{background:rgba(160,124,255,.18)}
  .mrow.win .bar i{background:var(--fix)}
  .mrow canvas{width:26px;height:26px;border-radius:4px;image-rendering:pixelated}
  .bar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--align);border-radius:4px;transition:width .5s}
  /* blocks strip */
  .brow{display:flex;align-items:center;gap:8px;margin:6px 0}
  .brow .lab{width:54px;font-size:12px;color:var(--dim)}
  .bcells{display:flex;flex-wrap:wrap;gap:2px;flex:1}
  .bcells i{width:7px;height:12px;border-radius:2px;opacity:.15;transition:opacity .15s}
  .bcells i.lit{opacity:1}
  .eq{font-size:13px;background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin:10px 0;color:#dfe5f3}
  /* meters */
  .meter{margin:8px 0}
  .meter .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}
  .meter .top b{color:#fff}
  .meter .track{position:relative;height:10px;background:rgba(255,255,255,.06);border-radius:5px;margin-top:4px;overflow:hidden}
  .meter .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fix);border-radius:5px;transition:width .35s, background .35s}
  .meter.over .track i{background:var(--dmg)}
  .meter.over .top b{color:var(--dmg)}
  /* steps */
  .steps{list-style:none;padding:0;margin:8px 0 0}
  .steps li{padding:6px 0 6px 26px;position:relative;font-size:13.5px;color:#cfd5e4;animation:in .35s ease}
  .steps li::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--faint)}
  .steps li.ok::before{background:var(--fix);box-shadow:0 0 10px var(--fix)}
  .steps li.bad::before{background:var(--dmg);box-shadow:0 0 10px var(--dmg)}
  .steps li.run::before{background:var(--format);animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.3}}
  @keyframes in{from{opacity:0;transform:translateY(4px)}}
  .synd{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px}
  .synd i{font-style:normal;font-size:9.5px;padding:1px 3px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--dim)}
  .synd i.nz{background:rgba(255,45,85,.25);color:#ffc2cf}
  .result{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;animation:in .4s ease}
  .result.ok{background:rgba(61,255,168,.1);border:1px solid rgba(61,255,168,.35)}
  .result.bad{background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.35)}
  .result .m{font-size:17px;color:#fff;word-break:break-word;margin-top:4px}
  /* tools */
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .tbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px}
  .tbtn:hover{border-color:rgba(255,255,255,.3)}
  .tbtn.on{background:#e9e4d6;color:#111}
  .tbtn.primary{background:var(--fix);color:#05170e;border-color:transparent;font-weight:650}
  .row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim)}
  input[type=range]{accent-color:#e9e4d6}

  /* nav */
  #nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:5;
    background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:7px 10px;backdrop-filter:blur(14px)}
  #nav .nb{background:transparent;border:0;padding:6px 10px;border-radius:10px;font-size:14px}
  #nav .nb:hover{background:rgba(255,255,255,.07)}
  #dots{display:flex;gap:6px}
  #dots button{width:26px;height:6px;border-radius:3px;border:0;background:rgba(255,255,255,.14);padding:0;position:relative;overflow:hidden}
  #dots button.on{background:rgba(255,255,255,.3)}
  #dots button.on i{position:absolute;left:0;top:0;bottom:0;background:#e9e4d6;width:0}
  #dots button.seen{background:rgba(233,228,214,.5)}
  #dots button:hover::after{content:attr(data-t);position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:#000c;padding:4px 8px;border-radius:6px;font-size:12px}
  #dots button{overflow:visible}
  #dots button.on i{border-radius:3px}

  /* labels & tooltip */
  .lbl{position:fixed;left:0;top:0;z-index:3;pointer-events:none;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
    color:#0b0d14;white-space:nowrap;transform:translate(-50%,-50%);transition:opacity .4s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #tip{position:fixed;z-index:6;pointer-events:none;background:#05070dee;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    font-size:12px;line-height:1.45;color:#dfe5f3;max-width:240px;opacity:0;transition:opacity .15s}
  #tip b{color:#fff}
  #toast{position:fixed;right:20px;bottom:22px;z-index:6;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 13px;
    font-size:13px;color:var(--dim);backdrop-filter:blur(12px);transition:opacity .6s}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;color:var(--dim);z-index:9}

  @media (max-width: 900px){
    #card{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:44vh;padding:16px 18px}
    #card h1{font-size:21px}
    #top{padding:10px;flex-wrap:wrap}
    #brand small{display:none}
    #msg{width:140px}
    #nav{bottom:10px}
    #dots button{width:14px}
    #toast{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <div id="brand">
    <div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div>Squares That Remember<small>How a QR code holds — and repairs — a message</small></div>
  </div>
  <div id="controls">
    <div class="field">
      <label for="msg">Message</label>
      <input id="msg" class="mono" spellcheck="false" autocomplete="off">
      <span id="cap" class="mono"></span>
    </div>
    <div class="field" title="Error-correction level: how much of the code is spent on repair data">
      <label>Repair level</label>
      <div class="seg" id="ecl">
        <button data-l="L">L</button><button data-l="M">M</button><button data-l="Q">Q</button><button data-l="H">H</button>
      </div>
    </div>
    <button class="iconbtn" id="flat" title="Face the code head-on so a phone camera can scan it">⌖ Face camera</button>
    <button class="iconbtn" id="snd" title="Toggle sound">♪ Sound: on</button>
  </div>
</div>

<div id="card"></div>

<div id="nav">
  <button class="nb" id="prev" title="Previous (←)">‹</button>
  <div id="dots"></div>
  <button class="nb" id="next" title="Next (→)">›</button>
  <button class="nb" id="play" title="Play / pause the tour (space)">❚❚</button>
</div>

<div id="tip"></div>
<div id="toast">♪ Tap anywhere to turn on sound</div>
<div id="err"><div><h2>Couldn't start WebGL / load Three.js</h2><p>This explainer loads Three.js from a CDN and needs WebGL. Check your connection and try a current browser.</p></div></div>

<!-- ===================================================================
     QR CORE — a real (scannable) Version 3 QR encoder and a decoder with
     full Reed–Solomon error correction over GF(256). No dependencies.
     =================================================================== -->
<script>
// ===== QRCORE START =====
const QRCore = (() => {
  const N = 29;                       // Version 3 → 17 + 4·3 = 29 modules per side
  const TOTAL = 70;                   // total codewords in Version 3
  // codewords per block for each error-correction level (Version 3)
  const ECL = {
    L: { fb: 1, blocks: 1, k: 55, ec: 15 },
    M: { fb: 0, blocks: 1, k: 44, ec: 26 },
    Q: { fb: 3, blocks: 2, k: 17, ec: 18 },
    H: { fb: 2, blocks: 2, k: 13, ec: 22 },
  };
  const FB2ECL = { 1: 'L', 0: 'M', 3: 'Q', 2: 'H' };

  // ---------- Galois field GF(2^8), primitive polynomial x^8+x^4+x^3+x^2+1 (0x11D)
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; }
  const mul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];
  const div = (a, b) => { if (b === 0) throw new Error('div0'); return a === 0 ? 0 : EXP[(LOG[a] + 255 - LOG[b]) % 255]; };
  const gpow = (a, p) => EXP[(((LOG[a] * p) % 255) + 255) % 255];
  const inv = (a) => EXP[255 - LOG[a]];
  const pScale = (p, x) => p.map(c => mul(c, x));
  const pAdd = (p, q) => { const r = new Array(Math.max(p.length, q.length)).fill(0);
    for (let i = 0; i < p.length; i++) r[i + r.length - p.length] = p[i];
    for (let i = 0; i < q.length; i++) r[i + r.length - q.length] ^= q[i]; return r; };
  const pMul = (p, q) => { const r = new Array(p.length + q.length - 1).fill(0);
    for (let j = 0; j < q.length; j++) for (let i = 0; i < p.length; i++) r[i + j] ^= mul(p[i], q[j]); return r; };
  const pEval = (p, x) => { let y = p[0]; for (let i = 1; i < p.length; i++) y = mul(y, x) ^ p[i]; return y; };
  const pDiv = (dividend, divisor) => { const out = dividend.slice();
    for (let i = 0; i < dividend.length - (divisor.length - 1); i++) { const c = out[i];
      if (c !== 0) for (let j = 1; j < divisor.length; j++) if (divisor[j] !== 0) out[i + j] ^= mul(divisor[j], c); }
    const sep = out.length - (divisor.length - 1); return [out.slice(0, sep), out.slice(sep)]; };
  const genCache = {};
  const genPoly = (n) => { if (genCache[n]) return genCache[n]; let g = [1]; for (let i = 0; i < n; i++) g = pMul(g, [1, gpow(2, i)]); return (genCache[n] = g); };

  function rsEncode(data, nsym) {
    const g = genPoly(nsym); const out = data.concat(new Array(nsym).fill(0));
    for (let i = 0; i < data.length; i++) { const c = out[i]; if (c !== 0) for (let j = 1; j < g.length; j++) out[i + j] ^= mul(g[j], c); }
    return out.slice(data.length);
  }
  function syndromes(msg, nsym) { const s = [0]; for (let i = 0; i < nsym; i++) s.push(pEval(msg, gpow(2, i))); return s; }
  // Berlekamp–Massey
  function findErrLoc(synd, nsym) {
    let errLoc = [1], oldLoc = [1]; const shift = synd.length - nsym;
    for (let i = 0; i < nsym; i++) {
      const K = i + shift; let delta = synd[K];
      for (let j = 1; j < errLoc.length; j++) delta ^= mul(errLoc[errLoc.length - 1 - j], synd[K - j]);
      oldLoc = oldLoc.concat([0]);
      if (delta !== 0) {
        if (oldLoc.length > errLoc.length) { const nl = pScale(oldLoc, delta); oldLoc = pScale(errLoc, inv(delta)); errLoc = nl; }
        errLoc = pAdd(errLoc, pScale(oldLoc, delta));
      }
    }
    while (errLoc.length && errLoc[0] === 0) errLoc.shift();
    if ((errLoc.length - 1) * 2 > nsym) throw new Error('too many errors');
    return errLoc;
  }
  // Chien search
  function findErrors(errLocRev, nmess) {
    const errs = errLocRev.length - 1, pos = [];
    for (let i = 0; i < nmess; i++) if (pEval(errLocRev, gpow(2, i)) === 0) pos.push(nmess - 1 - i);
    if (pos.length !== errs) throw new Error('locator roots outside the block');
    return pos;
  }
  // Forney
  function correctErrata(msg, synd, errPos) {
    const coefPos = errPos.map(p => msg.length - 1 - p);
    let eLoc = [1]; for (const i of coefPos) eLoc = pMul(eLoc, pAdd([1], [gpow(2, i), 0]));
    const sr = synd.slice().reverse();
    const errEval = pDiv(pMul(sr, eLoc), [1].concat(new Array(eLoc.length).fill(0)))[1];
    const X = coefPos.map(c => gpow(2, c - 255));
    const E = new Array(msg.length).fill(0), mags = [];
    for (let i = 0; i < X.length; i++) {
      const Xi = X[i], XiInv = inv(Xi); let prime = 1;
      for (let j = 0; j < X.length; j++) if (j !== i) prime = mul(prime, 1 ^ mul(XiInv, X[j]));
      if (prime === 0) throw new Error('forney failed');
      const y = mul(Xi, pEval(errEval, XiInv));
      E[errPos[i]] = div(y, prime); mags.push(E[errPos[i]]);
    }
    return { msg: pAdd(msg, E), mags };
  }
  function rsDecode(block, nsym) {
    const synd = syndromes(block, nsym);
    const res = { ok: false, synd: synd.slice(1), positions: [], mags: [], msg: block.slice(), degree: 0 };
    if (Math.max(...synd) === 0) { res.ok = true; return res; }
    try {
      const errLoc = findErrLoc(synd, nsym); res.degree = errLoc.length - 1;
      const pos = findErrors(errLoc.slice().reverse(), block.length);
      const c = correctErrata(block, synd, pos);
      if (Math.max(...syndromes(c.msg, nsym)) !== 0) throw new Error('still inconsistent');
      res.ok = true; res.positions = pos; res.mags = c.mags; res.msg = c.msg;
    } catch (e) { res.reason = e.message; }
    return res;
  }

  // ---------- geometry template (independent of content)
  const NN = N * N, idx = (x, y) => y * N + x;
  const role = new Array(NN).fill(null), tmpl = new Uint8Array(NN);
  const setF = (x, y, v, r) => { role[idx(x, y)] = r; tmpl[idx(x, y)] = v ? 1 : 0; };
  for (let i = 0; i < N; i++) { setF(6, i, i % 2 === 0, 'timing'); setF(i, 6, i % 2 === 0, 'timing'); }
  const finders = [];
  for (const [cx, cy] of [[3, 3], [N - 4, 3], [3, N - 4]]) {
    const cells = [];
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= N || y >= N) continue;
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      setF(x, y, d !== 2 && d !== 4, d === 4 ? 'sep' : 'finder');
      if (d <= 3) cells.push(idx(x, y));
    }
    finders.push(cells);
  }
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
    setF(22 + dx, 22 + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1, 'align');
  const formatPos = [[], []];
  for (let i = 0; i <= 5; i++) formatPos[0].push(idx(8, i));
  formatPos[0].push(idx(8, 7), idx(8, 8), idx(7, 8));
  for (let i = 9; i < 15; i++) formatPos[0].push(idx(14 - i, 8));
  for (let i = 0; i < 8; i++) formatPos[1].push(idx(N - 1 - i, 8));
  for (let i = 8; i < 15; i++) formatPos[1].push(idx(8, N - 15 + i));
  for (const c of formatPos) for (const m of c) { role[m] = 'format'; tmpl[m] = 0; }
  setF(8, N - 8, 1, 'dark');
  // zigzag order of all non-function modules
  const dataOrder = [];
  for (let right = N - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < N; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, upward = ((right + 1) & 2) === 0, y = upward ? N - 1 - vert : vert;
      if (role[idx(x, y)] === null) dataOrder.push(idx(x, y));
    }
  }
  const cwModules = []; for (let c = 0; c < TOTAL; c++) cwModules.push(dataOrder.slice(c * 8, c * 8 + 8));

  const maskFn = (m, x, y) => {
    switch (m) {
