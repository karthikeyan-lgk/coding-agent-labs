<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside an AI Data Centre</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#04060c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   Inside an AI Data Centre — a self-playing animated tour.
   Everything is drawn on one canvas in a 1600x900 virtual space.
   Keys: ← / → change chapter, Space pause. Click = next chapter.
   ===================================================================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1600, H = 900;
let S = 1, OX = 0, OY = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
  S = Math.min(innerWidth / W, innerHeight / H);
  OX = (innerWidth - W * S) / 2; OY = (innerHeight - H * S) / 2;
}
addEventListener('resize', resize); resize();

const FONT = '"Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif';
const MONO = '"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace';

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const seg = (t, a, b) => clamp((t - a) / (b - a));
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const fmt = n => Math.floor(n).toLocaleString('en-US');

function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function box(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function txt(s, x, y, size = 16, color = '#dfe7f5', align = 'left', weight = 500, font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function noGlow() { ctx.shadowBlur = 0; }
function dot(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = c; ctx.fill(); }
function line(pts, color, w) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
function poly(ps, fill, stroke) {
  ctx.beginPath(); ctx.moveTo(ps[0][0], ps[0][1]);
  for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i][0], ps[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function wrap(s, maxW, size, weight = 500) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function Path(pts) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return {
    pts, len: L[L.length - 1],
    at(d) {
      d = clamp(d, 0, this.len); let i = 1;
      while (i < L.length - 1 && L[i] < d) i++;
      const a = pts[i - 1], b = pts[i], f = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1);
      return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)];
    }
  };
}
function flow(path, t, n, speed, r, color, blur = 8) {
  glow(color, blur);
  for (let i = 0; i < n; i++) {
    const d = ((t * speed + i * path.len / n) % path.len + path.len) % path.len;
    const p = path.at(d); dot(p[0], p[1], r, color);
  }
  noGlow();
}
function pipe(pts, col, t, speed = 40, w = 8) {
  line(pts, '#0b111c', w + 6); line(pts, col, w);
  ctx.save(); ctx.setLineDash([w * .8, w * 1.8]); ctx.lineDashOffset = -t * speed;
  line(pts, 'rgba(255,255,255,.5)', Math.max(1.5, w * .35)); ctx.restore();
}
/* Callout: dot at (x,y), leader to (lx,ly), title/subtitle beside it. */
function callout(x, y, lx, ly, title, sub, a, align, color = '#7fd4ff') {
  if (a <= 0) return;
  align = align || (lx < x ? 'right' : 'left');
  ctx.save(); ctx.globalAlpha *= a;
  ctx.strokeStyle = color; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lerp(x, lx, ease(a)), lerp(y, ly, ease(a))); ctx.stroke();
  glow(color, 10); dot(x, y, 3.5, color); noGlow();
  const dx = align === 'left' ? 8 : -8;
  txt(title, lx + dx, ly - (sub ? 9 : 0), 16, '#ffffff', align, 650);
  if (sub) txt(sub, lx + dx, ly + 11, 13, '#9fb3cc', align, 400);
  ctx.restore();
}
/* soft round sprite for smoke / heat plumes */
const PUFF = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,150,90,1)'); gr.addColorStop(.4, 'rgba(255,130,80,.45)'); gr.addColorStop(1, 'rgba(255,120,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();
function puff(x, y, r) { ctx.drawImage(PUFF, x - r, y - r, r * 2, r * 2); }
function bg(top = '#060a14', bottom = '#0b1426') {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, H + 600);
  // faint blueprint grid
  ctx.strokeStyle = 'rgba(90,140,220,.05)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

/* =====================================================================
   SCENE 1 — THE CAMPUS
   ===================================================================== */
const STARS = [...Array(170)].map((_, i) => ({ x: hash(i) * 1900 - 150, y: hash(i + 500) * 560 - 80, r: hash(i + 900) * 1.3 + .3, p: hash(i + 1300) * 6 }));
const PYL = [-140, 60, 250], PB = 700, PH = 210;
const WATT = [[-34, 14], [34, 14], [-24, 44], [24, 44]];
function sagCurve(a, b, sag, n = 24) {
  const out = [];
  for (let i = 0; i <= n; i++) { const f = i / n; out.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f) + sag * 4 * f * (1 - f)]); }
  return out;
}
const WIRES = WATT.map((o, wi) => {
  let pts = [];
  for (let p = 0; p < PYL.length - 1; p++) {
    const c = sagCurve([PYL[p] + o[0], PB - PH + o[1]], [PYL[p + 1] + o[0], PB - PH + o[1]], 26);
    if (p > 0) c.shift(); pts = pts.concat(c);
  }
  const c = sagCurve(pts[pts.length - 1], [452 + wi * 16, 604], 14); c.shift();
  return Path(pts.concat(c));
});
const SUBCABLE = Path([[560, 690], [560, 716], [700, 716], [700, 700]]);
const FIBRE = Path([[1700, 772], [1350, 772], [1350, 700]]);

function pylon(x, t) {
  const top = PB - PH;
  ctx.strokeStyle = '#3b4a63'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x - 22, PB); ctx.lineTo(x - 5, top); ctx.lineTo(x + 5, top); ctx.lineTo(x + 22, PB);
  for (let k = 0; k < 6; k++) {
    const y1 = PB - k * PH / 6, y2 = PB - (k + 1) * PH / 6, w1 = lerp(22, 5, k / 6), w2 = lerp(22, 5, (k + 1) / 6);
    ctx.moveTo(x - w1, y1); ctx.lineTo(x + w2, y2); ctx.moveTo(x + w1, y1); ctx.lineTo(x - w2, y2);
  }
  ctx.moveTo(x - 38, top + 14); ctx.lineTo(x + 38, top + 14);
  ctx.moveTo(x - 28, top + 44); ctx.lineTo(x + 28, top + 44); ctx.stroke();
  dot(x, top - 3, 2.5, Math.sin(t * 3 + x) > 0 ? '#ff4040' : '#3a1010');
}

function sCampus(t, D) {
  ctx.save();
  const z = 1 + .07 * ease(t / D);
  ctx.translate(800, 560); ctx.scale(z, z); ctx.translate(-800, -560);
  // sky
  let g = ctx.createLinearGradient(0, -100, 0, 700);
  g.addColorStop(0, '#02040a'); g.addColorStop(.7, '#0a1530'); g.addColorStop(1, '#1a2448');
  ctx.fillStyle = g; ctx.fillRect(-300, -300, 2200, 1000);
  for (const s of STARS) { ctx.globalAlpha = .35 + .35 * Math.sin(t * 1.5 + s.p); dot(s.x, s.y, s.r, '#cfe0ff'); }
  ctx.globalAlpha = 1;
  // distant hills + city glow
  g = ctx.createRadialGradient(1500, 700, 10, 1500, 700, 500);
  g.addColorStop(0, 'rgba(255,150,80,.12)'); g.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = g; ctx.fillRect(900, 300, 1000, 400);
  ctx.beginPath(); ctx.moveTo(-300, 700);
  for (let x = -300; x <= 1900; x += 20) ctx.lineTo(x, 660 - 25 * Math.sin(x * .004) - 12 * Math.sin(x * .013 + 1));
  ctx.lineTo(1900, 700); ctx.closePath(); ctx.fillStyle = '#081022'; ctx.fill();
  // ground
  g = ctx.createLinearGradient(0, 700, 0, 900); g.addColorStop(0, '#0d1526'); g.addColorStop(1, '#04070d');
  ctx.fillStyle = g; ctx.fillRect(-300, 700, 2200, 400);
  ctx.fillStyle = '#1a2438'; ctx.fillRect(-300, 698, 2200, 3);

  // underground cables
  line(SUBCABLE.pts, 'rgba(255,170,60,.25)', 4); flow(SUBCABLE, t, 6, 60, 2, '#ffb347');
  line(FIBRE.pts, 'rgba(80,220,255,.25)', 3); flow(FIBRE, t, 9, 220, 2, '#6ff', 12);

  // pylons & wires
  for (const x of PYL) pylon(x, t);
  for (const w of WIRES) line(w.pts, '#5a6a84', 1.2);
  for (const w of WIRES) flow(w, t, 14, 140, 1.8, '#ffe27a', 10);

  // substation
  ctx.strokeStyle = '#3d4a60'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(440, 700); ctx.lineTo(440, 598); ctx.lineTo(520, 598); ctx.lineTo(520, 700); ctx.stroke();
  ctx.strokeStyle = '#2b3547'; ctx.lineWidth = 1;
  for (let x = 410; x <= 620; x += 8) { ctx.beginPath(); ctx.moveTo(x, 700); ctx.lineTo(x, 672); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(410, 672); ctx.lineTo(620, 672); ctx.stroke();
  for (const tx of [470, 545]) {
    box(tx, 640, 52, 58, 3, '#2a3446', '#46546e');
    ctx.strokeStyle = '#1b2230'; for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(tx + 6 + k * 8, 646); ctx.lineTo(tx + 6 + k * 8, 692); ctx.stroke(); }
    for (let k = 0; k < 3; k++) box(tx + 9 + k * 14, 626, 6, 14, 2, '#8a9bb5');
    glow('#ffb347', 20); dot(tx + 26, 668, 2 + Math.sin(t * 10) * .5, 'rgba(255,190,90,.8)'); noGlow();
  }

  // building
  const bx = 640, by = 440, bw = 800, bh = 260;
  g = ctx.createLinearGradient(0, by, 0, by + bh); g.addColorStop(0, '#232d42'); g.addColorStop(1, '#151c2b');
  ctx.fillStyle = g; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  for (let x = bx; x < bx + bw; x += 40) { ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh); ctx.stroke(); }
  ctx.fillStyle = '#10161f'; ctx.fillRect(bx, by + 20, bw, 22);
  for (let x = bx + 4; x < bx + bw; x += 8) { ctx.fillStyle = '#1d2636'; ctx.fillRect(x, by + 22, 4, 18); }
  for (const dx of [80, 360, 660]) { box(bx + dx, by + bh - 70, 70, 70, 2, '#1b2333', '#2b3650'); dot(bx + dx + 35, by + bh - 80, 3, '#ffd88a'); }
  // cutaway interior
  const ca = ease(seg(t, 6, 8));
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca;
    const ix = 660, iy = 500, iw = 760, ih = 190;
    ctx.fillStyle = '#050911'; ctx.fillRect(ix, iy, iw, ih);
    pipe([[ix, iy + 18], [ix + iw, iy + 18]], '#2f8cff', t, 50, 4);
    pipe([[ix + iw, iy + 30], [ix, iy + 30]], '#ff5a3c', t, 50, 4);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(ix, iy + 40, iw, 3);
    for (let i = 0; i < 31; i++) {
      const rx = ix + 12 + i * 24.2;
      box(rx, iy + 56, 19, 124, 2, '#141c2a', '#26324a');
      for (let k = 0; k < 9; k++) {
        const on = hash(i * 31 + k + Math.floor(t * 4 + hash(i + k) * 4)) > .35;
        dot(rx + 5, iy + 66 + k * 12.5, 1.4, on ? (k % 3 ? '#38f2a0' : '#52b8ff') : '#13312a');
      }
    }
    const gg = ctx.createLinearGradient(0, iy, 0, iy + ih); gg.addColorStop(0, 'rgba(80,160,255,.08)'); gg.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(ix, iy, iw, ih);
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]); ctx.strokeRect(ix, iy, iw, ih); ctx.setLineDash([]);
    ctx.restore();
  }
  // rooftop dry coolers
  for (let i = 0; i < 10; i++) {
    const ux = 668 + i * 76;
    box(ux, 410, 66, 30, 2, '#2c3850', '#3e4c68');
    for (let f = 0; f < 2; f++) {
      const fx = ux + 17 + f * 32, fy = 410;
      ctx.beginPath(); ctx.ellipse(fx, fy, 13, 4, 0, 0, 6.29); ctx.fillStyle = '#0f1520'; ctx.fill();
      ctx.strokeStyle = '#7d8fae'; ctx.lineWidth = 1.5;
      for (let b = 0; b < 3; b++) {
        const an = t * 9 + b * 2.094 + i;
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + Math.cos(an) * 12, fy + Math.sin(an) * 3.6); ctx.stroke();
      }
    }
  }
  // warm plume
  for (let i = 0; i < 90; i++) {
    const ph = (t * .12 + hash(i)) % 1;
    const x = 680 + hash(i + 3) * 740 + Math.sin(ph * 6 + i) * 18 + ph * 40;
    const y = 404 - ph * 280;
    ctx.globalAlpha = (1 - ph) * .16 * (ph < .1 ? ph * 10 : 1);
    ctx.globalCompositeOperation = 'lighter';
    puff(x, y, 10 + ph * 34);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // generators
  for (let i = 0; i < 3; i++) {
    const gx = 1462 + i * 44;
    box(gx, 648, 38, 52, 2, '#2f3a2c', '#4b5a44');
    ctx.fillStyle = '#1b2219'; for (let k = 0; k < 5; k++) ctx.fillRect(gx + 5, 656 + k * 8, 28, 3);
    ctx.fillStyle = '#4b5a44'; ctx.fillRect(gx + 28, 636, 5, 12);
  }
  // callouts
  callout(505, 660, 380, 752, 'Substation', '132 kV from the grid → 33 kV', seg(t, 1.5, 2.3), 'right', '#ffd36a');
  callout(905, 404, 905, 330, 'Dry coolers', 'dump heat into the night air', seg(t, 3, 3.8), 'left', '#ff9a6a');
  callout(1505, 648, 1540, 590, 'Backup generators', 'take over in seconds', seg(t, 4.5, 5.3), 'right', '#9fe07a');
  callout(1430, 772, 1540, 748, 'Fibre to the internet', 'terabits per second', seg(t, 6, 6.8), 'right', '#6ff');
  callout(1000, 600, 1110, 470, 'Data halls', 'tens of thousands of GPUs', seg(t, 8.5, 9.3), 'left', '#7fd4ff');
  ctx.restore();

  // title card
  const ta = seg(t, .2, 1.2) * (1 - seg(t, 3.6, 4.8));
  if (ta > 0) {
    ctx.save(); ctx.globalAlpha = ta;
    glow('rgba(120,200,255,.6)', 30);
    txt('INSIDE AN AI DATA CENTRE', 800, 230 - (1 - ta) * 10, 68, '#ffffff', 'center', 800);
    noGlow();
    txt('From the power grid to a single multiplication — a self-playing tour', 800, 290, 21, '#a9c3e6', 'center', 400);
    ctx.restore();
  }
}

/* =====================================================================
   SCENE 2 — POWER
   ===================================================================== */
const PN = [
  { x: 170, y: 250, name: 'Grid', v: '132 kV AC', ic: 'grid' },
  { x: 550, y: 250, name: 'Substation', v: '→ 33 kV', ic: 'tx' },
  { x: 930, y: 250, name: 'Switchgear', v: '33 kV', ic: 'sw' },
  { x: 1310, y: 250, name: 'UPS', v: 'batteries', ic: 'ups' },
  { x: 1310, y: 560, name: 'Transformer', v: '→ 415 V AC', ic: 'tx' },
  { x: 930, y: 560, name: 'Busway / PDU', v: '415 V AC', ic: 'bus' },
  { x: 550, y: 560, name: 'Rack power shelf', v: '→ 50 V DC', ic: 'tx' },
  { x: 170, y: 560, name: 'GPU regulators', v: '→ ~0.8 V', ic: 'chip' },
];
const PSEG = [
  [[265, 250], [455, 250]], [[645, 250], [835, 250]], [[1025, 250], [1215, 250]],
  [[1310, 305], [1310, 505]], [[1215, 560], [1025, 560]], [[835, 560], [645, 560]], [[455, 560], [265, 560]],
].map(Path);
const PW = [2, 2.5, 3, 4, 6, 8, 11], PR = [1.6, 1.8, 2, 2.4, 3, 3.4, 4], PNUM = [6, 6, 6, 9, 10, 13, 16];
const PCOL = ['#bfefff', '#bfefff', '#d6f0ff', '#ffe27a', '#ffd24a', '#ffb13b', '#ff8a2a'];
const GENPATH = Path([[1120, 373], [1120, 250]]);

function pIcon(n, cx, cy, t, s) {
  ctx.strokeStyle = '#8fb3d9'; ctx.lineWidth = 1.6;
  if (n.ic === 'grid') {
    ctx.beginPath(); ctx.moveTo(cx - 10, cy + 10); ctx.lineTo(cx - 2, cy - 12); ctx.lineTo(cx + 2, cy - 12); ctx.lineTo(cx + 10, cy + 10);
    ctx.moveTo(cx - 14, cy - 7); ctx.lineTo(cx + 14, cy - 7); ctx.stroke();
  } else if (n.ic === 'tx') {
    ctx.beginPath(); ctx.arc(cx - 6, cy, 9, 0, 6.29); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 6, cy, 9, 0, 6.29); ctx.stroke();
  } else if (n.ic === 'sw') {
    ctx.beginPath(); ctx.moveTo(cx - 18, cy); ctx.lineTo(cx - 6, cy); ctx.lineTo(cx + 8, cy - 8); ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + 18, cy); ctx.stroke();
    dot(cx - 6, cy, 2.5, '#8fb3d9'); dot(cx + 8, cy, 2.5, '#8fb3d9');
  } else if (n.ic === 'ups') {
    box(cx - 50, cy - 8, 92, 16, 3, '#0b1220', '#8fb3d9'); ctx.fillStyle = '#8fb3d9'; ctx.fillRect(cx + 43, cy - 4, 4, 8);
    const lv = s.batt; ctx.fillStyle = s.onBatt ? '#ffb13b' : '#38f2a0'; ctx.fillRect(cx - 47, cy - 5, 86 * lv, 10);
  } else if (n.ic === 'bus') {
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(cx - 20, cy + k * 6); ctx.lineTo(cx + 20, cy + k * 6); ctx.stroke(); }
  } else if (n.ic === 'chip') {
    ctx.strokeRect(cx - 10, cy - 10, 20, 20);
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(cx - 15, cy + k * 6); ctx.lineTo(cx - 10, cy + k * 6); ctx.moveTo(cx + 10, cy + k * 6); ctx.lineTo(cx + 15, cy + k * 6);
      ctx.moveTo(cx + k * 6, cy - 15); ctx.lineTo(cx + k * 6, cy - 10); ctx.moveTo(cx + k * 6, cy + 10); ctx.lineTo(cx + k * 6, cy + 15); ctx.stroke();
    }
    glow('#ff8a2a', 16); dot(cx, cy, 4, 'rgba(255,140,50,.9)'); noGlow();
  }
}
function sPower(t, D) {
  bg();
  const gridOn = !(t > 8.5 && t < 12.5), genOn = t > 10.3 && t < 13.8, genSpin = t > 9.6 && t < 14.2;
  const onBatt = !gridOn && !genOn;
  const batt = t < 8.5 ? 1 : t < 10.3 ? 1 - .28 * seg(t, 8.5, 10.3) : .72 + .28 * seg(t, 10.3, 14);
  const st = { batt, onBatt };
  const rev = i => ease(seg(t, .3 + i * .45, .8 + i * .45));
  // segments
  for (let i = 0; i < 7; i++) {
    const a = rev(i + 1); if (a <= 0) continue;
    const live = i < 2 ? gridOn : i === 2 ? (gridOn || genOn) : true;
    ctx.save(); ctx.globalAlpha = a;
    line(PSEG[i].pts, live ? 'rgba(255,220,120,.18)' : 'rgba(120,130,150,.15)', PW[i] + 6);
    line(PSEG[i].pts, live ? PCOL[i] : '#3a4358', PW[i] * .5);
    if (live) flow(PSEG[i], t, PNUM[i], 90, PR[i], PCOL[i], 12);
    ctx.restore();
  }
  // generator
  const ga = ease(seg(t, 4, 5));
  if (ga > 0) {
    ctx.save(); ctx.globalAlpha = ga;

  for (let i = 0; i < 110; i++) {
    const ph = (t * .22 + hash(i)) % 1;
    const x = 1080 + hash(i + 2) * 360 + Math.sin(ph * 5 + i) * 20 + ph * 60, y = 200 - ph * 190;
    ctx.globalAlpha = (1 - ph) * .2 * Math.min(1, ph * 10); ctx.globalCompositeOperation = 'lighter'; puff(x, y, 10 + ph * 40);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  txt('heat into the atmosphere ↗', 1050, 150, 14, '#ffb08a', 'right', 600);
  // PUE card
  const pa = ease(seg(t, 7.5, 8.5));
  if (pa > 0) {
    ctx.save(); ctx.globalAlpha = pa;
    box(1090, 400, 400, 300, 12, 'rgba(10,16,30,.92)', '#2a3a5a');
    txt('WHERE EACH 120 W GOES', 1110, 428, 12, '#8fa6c8', 'left', 800, MONO);
    const bars = [['Computing (GPUs, CPUs, network)', 100, '#38f2a0'], ['Cooling (pumps, fans, chillers)', 14, '#5aa8ff'], ['Power conversion losses', 6, '#ffd24a']];
    bars.forEach((b, i) => {
      const y = 460 + i * 62, w = 320 * b[1] / 100 * ease(seg(t, 8 + i * .3, 9 + i * .3));
      txt(b[0], 1110, y, 13, '#c9d4e6', 'left', 500);
      box(1110, y + 12, Math.max(4, w), 18, 4, b[2]);
      txt(`${b[1]} W`, 1115 + Math.max(4, w) + 4, y + 21, 12, b[2], 'left', 700, MONO);
    });
    txt('PUE ≈ 1.2  (total power ÷ computing power)', 1110, 668, 13, '#ffffff', 'left', 650, MONO);
    ctx.restore();
  }
  // end card
  const ea = ease(seg(t, 11.4, 12.6));
  if (ea > 0) {
    ctx.save(); ctx.globalAlpha = ea * .9; ctx.fillStyle = '#03050b'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = ea;
    glow('rgba(120,200,255,.6)', 30);
    txt('Electricity in. Heat out.', 800, 330, 60, '#ffffff', 'center', 800);
    noGlow();
    txt('And in between, quadrillions of multiplications a second —', 800, 410, 24, '#a9c3e6', 'center', 400);
    txt('which is all an AI answer really is.', 800, 446, 24, '#a9c3e6', 'center', 400);
    txt('restarting tour…', 800, 540, 14, '#4a5a7a', 'center', 600, MONO);
    ctx.restore();
  }
}

/* =====================================================================
   TIMELINE
   ===================================================================== */
const SCENES = [
  { name: 'The campus', dur: 15, draw: sCampus, caps: [
    [0, 'An AI data centre looks like a warehouse. It behaves more like a power plant running in reverse.'],
    [5, 'It pulls in 100+ megawatts — enough for a small city — and turns almost all of it into heat.'],
    [10, 'Inside are rows of machines doing one thing, unbelievably fast: multiplying numbers.']] },
  { name: 'Power', dur: 15, draw: sPower, caps: [
    [0, 'Electricity arrives at transmission voltage and is stepped down, stage by stage, until it reaches the chip.'],
    [5, 'Each step lowers the voltage and raises the current: a GPU runs on under 1 volt but draws around 1,000 amps.'],
    [8.5, 'If the grid fails, batteries carry the whole load instantly…'],
    [10.5, '…while backup generators roar to life. The GPUs never notice.']] },
  { name: 'The data hall', dur: 15, draw: sHall, caps: [
    [0, 'The data hall: long rows of racks, packed as tightly as power and cooling allow.'],
    [4.5, 'Cool air comes in at the front of each rack; heat leaves at the back into a sealed hot aisle.'],
    [9.5, 'AI racks are so dense that air alone can’t cool them, so liquid is piped to every server.']] },
  { name: 'Inside a rack', dur: 15, draw: sRack, caps: [
    [0, 'One rack: power shelves at top and bottom, compute trays and network switch trays in between.'],
    [4.5, 'Each compute tray holds GPUs and CPUs. Liquid-filled cold plates sit directly on the hottest chips.'],
    [10, 'Thousands of copper cables at the back tie 72 GPUs together so they act like one giant GPU.']] },
  { name: 'Inside the chip', dur: 14, draw: sChip, caps: [
    [0, 'Zoom into one GPU: a slab of silicon ringed by stacks of ultra-fast memory.'],
    [3, 'Almost everything an AI model does is matrix multiplication: rows times columns, summed up.'],
    [8, 'Tensor cores do whole blocks at once — around a quadrillion multiply-adds every second.']] },
  { name: 'Training', dur: 15, draw: sNet, caps: [
    [0, 'Big models are trained on tens of thousands of GPUs at once, wired together by a high-speed network.'],
    [5, 'Each step, every GPU learns from its slice of data, then they all swap results (an “all-reduce”).'],
    [10, 'Repeat that millions of times over weeks, and the model’s error slowly falls. That’s training.']] },
  { name: 'Your question', dur: 15, draw: sPrompt, caps: [
    [0, 'Now the part you see. You type a question…'],
    [1, 'It crosses the internet, passes the front door, and a router picks a GPU server with spare room.'],
    [3, '“Prefill”: the model reads your whole prompt in one parallel pass.'],
    [4.6, '“Decode”: the answer is produced one token at a time, each streamed back the moment it exists.'],
    [10.5, 'The same GPUs are answering hundreds of other people in the same batch, right now.']] },
  { name: 'Heat out', dur: 16, draw: sHeat, caps: [
    [0, 'Every watt that goes into a chip comes out as heat. It has to go somewhere.'],
    [3.5, 'Liquid carries it from the cold plates to a heat exchanger, then out to coolers on the roof.'],
    [7.5, 'Cooling and power conversion add roughly 10–30% on top of the computing itself.'],
    [11.4, ' ']] },
];

let si = 0, st = 0, G = 0, paused = false, last = performance.now();
// optional deep link: index.html#3 (chapter 3) or #3@6.5 (chapter 3 at 6.5 s)
{ const m = location.hash.match(/^#(\d+)(?:@([\d.]+))?/); if (m) { si = clamp(+m[1] - 1, 0, SCENES.length - 1); st = +(m[2] || 0); } }
function go(d) { si = (si + d + SCENES.length) % SCENES.length; st = 0; }
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { paused = !paused; e.preventDefault(); }
});
cv.addEventListener('click', () => go(1));

function hud(sc, t) {
  // top-left
  txt('INSIDE AN AI DATA CENTRE', 40, 32, 12, '#5f7aa0', 'left', 800, MONO);
  txt(String(si + 1).padStart(2, '0'), 40, 62, 22, '#7fd4ff', 'left', 700, MONO);
  txt(sc.name, 76, 62, 24, '#ffffff', 'left', 700);
  // top-right live stats
  const mw = 142 + 3 * Math.sin(G * .4) + 1.2 * Math.sin(G * 2.1);
  const rows = [
    ['FACILITY LOAD', mw.toFixed(1) + ' MW'],
    ['GPUs ONLINE', fmt(98304 - (Math.sin(G * .2) > .95 ? 8 : 0))],
    ['TOKENS SERVED TODAY', fmt(8.41e9 + G * 1.37e6)],
    ['INLET TEMP', (24.4 + .4 * Math.sin(G * .5)).toFixed(1) + ' °C'],
  ];
  rows.forEach((r, i) => {
    txt(r[1], 1560, 30 + i * 20, 13, '#cfe6ff', 'right', 700, MONO);
    txt(r[0], 1560 - 130, 30 + i * 20, 11, '#5f7aa0', 'right', 700, MONO);
  });
  // caption
  let ci = 0; for (let i = 0; i < sc.caps.length; i++) if (t >= sc.caps[i][0]) ci = i;
  const [ct, s] = sc.caps[ci];
  if (s.trim()) {
    const a = seg(t, ct, ct + .5) * (1 - seg(t, sc.dur - .6, sc.dur));
    const lines = wrap(s, 1160, 23, 500), h = lines.length * 32 + 26;
    ctx.save(); ctx.globalAlpha = a;
    const top = 836 - h / 2 + (1 - a) * 8;
    box(190, top, 1220, h, 14, 'rgba(6,10,20,.82)', 'rgba(120,170,255,.2)');
    lines.forEach((l, i) => txt(l, 800, top + 13 + 16 + i * 32, 23, '#eef4ff', 'center', 500));
    ctx.restore();
  }
  // progress
  const n = SCENES.length, sw = 90, gap = 8, x0 = 800 - (n * sw + (n - 1) * gap) / 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (sw + gap);
    box(x, 884, sw, 4, 2, 'rgba(255,255,255,.12)');
    const f = i < si ? 1 : i === si ? t / sc.dur : 0;
    if (f > 0) box(x, 884, sw * f, 4, 2, '#7fd4ff');
  }
  txt(paused ? '❚❚ paused · space to resume' : '← → chapters · space pause', 1580, 886, 11, '#3f5070', 'right', 600, MONO);
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) { st += dt; G += dt; }
  let sc = SCENES[si];
  if (st >= sc.dur) { go(1); sc = SCENES[si]; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save(); sc.draw(st, sc.dur); ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  const fade = 1 - Math.min(seg(st, 0, .7), 1 - seg(st, sc.dur - .7, sc.dur));
  if (fade > 0) { ctx.fillStyle = `rgba(4,6,12,${fade})`; ctx.fillRect(0, 0, W, H); }
  hud(sc, st);
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
